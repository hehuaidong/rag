spring:
  application:
    name: rag
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_java
    username: hehuaidong
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10s

server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:sk-2509e697bc6f449eb7f8fb042258fbe3}
      model-name: qwen3.6-plus
      timeout: 60s
      log-requests: true
      log-responses: true
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:sk-2509e697bc6f449eb7f8fb042258fbe3}
      model-name: text-embedding-v4
      dimensions: 1024
      timeout: 30s
      log-requests: true
      log-responses: true

rag:
  document:
    chunk-size: 500
    chunk-overlap: 50
    supported-types: txt,md,pdf
  retrieval:
    top-k: 5
    max-distance: 0.35
  chat-history:
    max-context-rounds: 10
    ttl-minutes: 60
